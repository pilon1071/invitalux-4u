[build]
  publish = "."

# Canva exports in galeria/ embed Canva's public Google Maps browser keys,
# which trip Netlify's secrets scanner. Skip scanning only that folder.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "galeria/**"
  SECRETS_SCAN_SMART_DETECTION_OMIT_PATHS = "galeria/**"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
